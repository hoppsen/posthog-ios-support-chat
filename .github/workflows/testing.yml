name: Testing

on:
  pull_request:

  push:
    branches:
      - main

jobs:
  Tests:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run package tests
        run: |
          xcodebuild test \
            -scheme PostHogSupportChat-Package \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            | xcbeautify --renderer github-actions || exit ${PIPESTATUS[0]}
